
#specifies the different services (images) to use
services:
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      - mariadb
    expose:
      - "9000"
    networks:
      default: {}
    volumes:
      - wp_content:/var/www/html/wordpress
    secrets:
      - wordpress
      - database
    
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    expose:
      - "3306"
    networks:
      default: {}
    volumes:
      - db_data:/var/lib/mysql/
    secrets:
      - database

  nginx:
    build: requirements/nginx
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      default: {}
    volumes:
      - wp_content:/var/www/html/wordpress

networks:
  default: {}

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $HOME/data/db_data
  wp_content:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $HOME/data/wp_content

secrets:
  database:
    file: ../secrets/db_credentials.txt
  wordpress:
    file: ../secrets/wp_credentials.txt