
#specifies the different services (images) to use
services:
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "9000"
    networks:
      default: {}
    volumes:
      - wp_content:/var/www/html/wordpress
    secrets:
      - wordpress
      - database
    
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    expose:
      - "3306"
    networks:
      default: {}
    volumes:
      - db_data:/var/lib/mysql/
    secrets:
      - database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    build: 
      context: requirements/nginx
      args: 
        DOMAIN_NAME: ${DOMAIN_NAME}
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "443:443"
    env_file: .env
    networks:
      default: {}
    volumes:
      - wp_content:/var/www/html/wordpress

networks:
  default: {}

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $HOME/data/db_data
  wp_content:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $HOME/data/wp_content

secrets:
  database:
    file: ../secrets/db_credentials.txt
  wordpress:
    file: ../secrets/wp_credentials.txt